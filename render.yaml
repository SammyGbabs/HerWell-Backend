# Render Blueprint: New → Blueprint → pick this repo.
# Secrets marked `sync: false` are asked for once in the Render dashboard.
services:
  - type: web
    name: herwell-backend
    runtime: python
    plan: free
    region: frankfurt # closest Render region to East Africa; match your Supabase region
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # e.g. api.herwellafrica.com (the onrender.com host is added automatically)
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://herwellafrica.com,https://www.herwellafrica.com
      - key: DATABASE_URL
        sync: false # Supabase → Connect → Session pooler URI
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: resources
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: VERCEL_DEPLOY_HOOK_URL
        sync: false

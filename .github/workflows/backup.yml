# Supabase's free plan has no backups. This dumps the database every week and
# keeps it as a private workflow artifact for 90 days.
# Needs repo secret: DATABASE_URL (the Supabase Session pooler URI).
name: Weekly database backup

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir backups
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --no-owner --no-privileges --schema=public --format=custom \
            --file "backups/herwell-$(date -u +%Y-%m-%d).dump"

      - uses: actions/upload-artifact@v4
        with:
          name: herwell-db-${{ github.run_id }}
          path: backups/
          retention-days: 90
